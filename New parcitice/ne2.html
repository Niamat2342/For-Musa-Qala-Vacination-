<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 20% 50%;
            transform: translate(-50% -50%);
            background-color: brown;
        }
        .login{
            border: 1px solid black;
            width: 700px;
            height: 500px;
            background-image: url(./Log.webp);
            background-size: cover;
            color: wheat;
            border-radius: 20px;
            box-shadow: 0 0 20px ;
            background-position: center;
            overflow: hidden;
        }
        form{
            display: block;
            box-sizing: border-box;
            padding: 40px;
            width: 100%;
            height: 100%;
            backdrop-filter: brightness(40%);
            flex-direction: column;
            display: block;
        }
        .login input{
            width: auto;
            display: flex;
            justify-content: center;
            position: relative;
           left: 33px;
        }
    </style>
</head>
<body>
    <div class="login">
        <form action="">
            <h1>Login</h1>
            <label for=""> UserNmae</label>
            <input type="text">
            <label for=""> Password</label>
            <input type="password">
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
